name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # official X2 MJCF, needed by the asset/env tests
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra cpu --extra dev --extra deploy
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
